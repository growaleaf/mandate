'use strict';
/*CORE_START*/
const CORE=(function(){
  // deterministic RNG
  function mulberry32(seed){
    let a=seed>>>0;
    return function(){
      a|=0; a=(a+0x6D2B79F5)|0;
      let t=Math.imul(a^(a>>>15),1|a);
      t=(t+Math.imul(t^(t>>>7),61|t))^t;
      return ((t^(t>>>14))>>>0)/4294967296;
    };
  }
  function shuffle(rng,arr){
    const a=arr.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function pickN(rng,arr,n){ return shuffle(rng,arr).slice(0,n); }
  // Build the 3 pitch options for one faction: their favored lever, their hated
  // lever, and one neutral lever — each with a seeded line variant, order shuffled.
  function whipOptions(rng,levers,fav,hate,lines){
    const neutralPool=levers.filter(l=>l!==fav&&l!==hate);
    const neutral=neutralPool[Math.floor(rng()*neutralPool.length)];
    const opt=l=>({lever:l,text:lines[l][Math.floor(rng()*lines[l].length)]});
    return shuffle(rng,[opt(fav),opt(hate),opt(neutral)]);
  }
  // picks: array of lever chosen per faction; factions: [{fav,hate}]
  function resolveWhip(picks,factions){
    let yea=0,nay=0,abstain=0,correct=0;
    const votes=picks.map((p,i)=>{
      if(p===factions[i].fav){ yea++; correct++; return 'YEA'; }
      if(p===factions[i].hate){ nay++; return 'NAY'; }
      abstain++; return 'ABSTAIN';
    });
    return {votes,yea,nay,abstain,correct};
  }
  function votePasses(yea,nay){ return yea>=2 && yea>nay; }
  function streakMult(streak){ return 1+0.25*Math.min(streak,2); }
  // KPI change for a round. integer=true → whole-number KPI (wars).
  function kpiDelta(base,correct,streak,passed,rider,integer){
    if(!passed) return -rider;
    if(integer) return base+(correct>=3?1:0)+(Math.min(streak,2)>=2?1:0);
    return base*(1+0.5*Math.max(0,correct-2))*streakMult(streak);
  }
  // tiers: [{min,label}] ascending by min; returns label of highest min <= v
  function gradeFor(tiers,v){
    let out=tiers[0].label;
    for(const t of tiers) if(v>=t.min) out=t.label;
    return out;
  }
  const fmtDebt=v=>'$'+v.toFixed(3)+'T';
  const fmtMT=v=>v.toFixed(1)+' MT/yr';
  // whole-unit KPI formatter: 1 war / 14 wars, 1 prophecy / 9 prophecies
  const fmtUnit=(one,many)=>v=>{ const n=Math.round(v); return n+' '+(n===1?one:many); };
  const fmtWars=fmtUnit('war','wars');

  // ---- THE DAILY ----
  // One run per UTC day, identical for every player on Earth. Day 0 is 2026-08-26
  // (the day THE MANDATE shipped), so the first Daily — 2026-08-27 — is №1.
  function utcDateStr(t){ return new Date(t).toISOString().slice(0,10); }
  function dailyNumber(dateStr){
    const d=Date.UTC(+dateStr.slice(0,4),+dateStr.slice(5,7)-1,+dateStr.slice(8,10));
    return Math.round((d-Date.UTC(2026,7,26))/86400000);
  }
  // FNV-1a over the date string, then avalanched: same date → same seed, anywhere.
  function dailySeed(dateStr){
    let h=2166136261>>>0;
    for(let i=0;i<dateStr.length;i++){ h=Math.imul(h^dateStr.charCodeAt(i),16777619)>>>0; }
    h^=h>>>13; h=Math.imul(h,0x5bd1e995)>>>0; h^=h>>>15;
    return h>>>0;
  }
  // The Daily walks the whole anthology, one pack per day, in order.
  function dailyPackIndex(dateStr,count){ const n=dailyNumber(dateStr)%count; return (n+count)%count; }
  function msToNextUtcDay(t){ return 86400000-(((t%86400000)+86400000)%86400000); }
  function fmtCountdown(ms){
    const s=Math.max(0,Math.floor(ms/1000));
    const h=Math.floor(s/3600), m=Math.floor(s%3600/60);
    return h>0?(h+'h '+m+'m'):(m+'m '+(s%60)+'s');
  }

  function emojiShare(tag,title,kpiStr,grade,headline,maxStreak,correct,total,dailyNo){
    return tag+' THE MANDATE — '+title+'\n'
      +(dailyNo==null?'':'🗞 DAILY MANDATE №'+dailyNo+'\n')
      +'📊 '+kpiStr+' · '+grade+'\n'
      +'📰 "'+headline+'"\n'
      +'🔥 momentum ×'+streakMult(maxStreak).toFixed(2)
      +' · whip '+correct+'/'+total+'\n'
      +'https://mandate.defimagic.io';
  }
  return {mulberry32,shuffle,pickN,whipOptions,resolveWhip,votePasses,
          streakMult,kpiDelta,gradeFor,fmtDebt,fmtMT,fmtUnit,fmtWars,
          utcDateStr,dailyNumber,dailySeed,dailyPackIndex,msToNextUtcDay,fmtCountdown,
          emojiShare};
})();
/*CORE_END*/

// ============================ AUDIO (tiny) ============================
let AC=null;
function audio(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function tone(f,d,type,v){ if(!AC) return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.value=f;
  g.gain.setValueAtTime(v||0.18,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+d+0.02);
}
const sndPass=()=>{tone(220,0.15,'square',0.12);setTimeout(()=>tone(330,0.2,'square',0.12),90);};
const sndFail=()=>{tone(180,0.3,'sawtooth',0.1);setTimeout(()=>tone(140,0.4,'sawtooth',0.1),160);};
const sndClick=()=>tone(600,0.04,'triangle',0.08);
const sndTick=()=>tone(900,0.03,'square',0.05);

// ============================ ENGINE ============================
const app=document.getElementById('app');
const kpiBar=document.getElementById('kpiBar');
let S=null; // run state
let kpiAnim=null;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function setTicker(scn,extra){
  const pool=(scn?scn.ticker.slice():['All nations fictional. All incentives real.']).concat(extra||[]);
  document.getElementById('tickerIn').textContent=pool.join('   •••   ')+'   •••   ';
}
function showKpi(scn){
  kpiBar.style.display='block';
  document.getElementById('kpiLabel').textContent=scn.kpiLabel;
  document.getElementById('kpiSub').textContent=scn.venue;
  renderKpi(S.kpi);
}
function renderKpi(v){ document.getElementById('kpiVal').textContent=S.scn.fmt(v); }
function animKpi(from,to){
  if(kpiAnim) cancelAnimationFrame(kpiAnim);
  const t0=performance.now(), dur=1100;
  function step(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    renderKpi(from+(to-from)*e);
    if(p<1) kpiAnim=requestAnimationFrame(step);
  }
  kpiAnim=requestAnimationFrame(step);
  // settle even if rAF is throttled (backgrounded tab)
  setTimeout(()=>renderKpi(to), dur+150);
}
function bestKey(id){ return 'mandate_best_'+id; }
function fmtGainNum(scn,v){ return scn.fmt(v); }

// ---------- the daily ----------
// One mandate per UTC day — the same one for every player on earth — walking the
// whole anthology a pack at a time. Played once; after that you get the receipt.
function todayStr(){ return CORE.utcDateStr(Date.now()); }
function dailyPack(d){ return SCENARIOS[CORE.dailyPackIndex(d, SCENARIOS.length)]; }
function dailyKey(d){ return 'mandate_daily_'+d; }
function dailyRecord(d){
  try{ const raw=localStorage.getItem(dailyKey(d)); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function saveDaily(d,rec){ try{ localStorage.setItem(dailyKey(d),JSON.stringify(rec)); }catch(e){} }
let titleTimer=null;
function clearTitleTimer(){ if(titleTimer){ clearInterval(titleTimer); titleTimer=null; } }

// ---------- title ----------
function screenTitle(){
  clearTitleTimer();
  kpiBar.style.display='none';
  setTicker(null,['You promised. They believed you. Deliver.']);
  const dstr=todayStr(), dno=CORE.dailyNumber(dstr), drec=dailyRecord(dstr), dscn=dailyPack(dstr);
  let h='<div class="card daily">'
    +'<div class="dailyHead"><span>THE DAILY MANDATE</span><span class="dailyNo">№'+dno+'</span></div>';
  if(drec){
    h+='<div class="meta">'+esc(drec.title)+' — filed.</div>'
      +'<div class="dailyResult">'+esc(drec.kpi)+'</div>'
      +'<div class="dailyGrade">'+esc(drec.grade)+'</div>'
      +'<div class="meta" id="dailyCd" style="margin-top:9px">the next mandate is at the typesetter</div>'
      +'<button class="btn btnGhost" id="bDailyCopy">COPY TODAY’S RESULT</button>';
  }else{
    h+='<div class="meta">Every player on earth gets this one today.</div>'
      +'<div class="billName" style="margin-top:7px">'+dscn.tag+' '+esc(dscn.title)+'</div>'
      +'<div class="mandateLine">'+esc(dscn.blurb)+'</div>'
      +'<button class="btn" id="bDaily">PLAY TODAY’S MANDATE</button>';
  }
  h+='</div><h3>Free play — '+SCENARIOS.length+' mandates</h3>';
  for(const s of SCENARIOS){
    const best=localStorage.getItem(bestKey(s.id));
    h+='<button class="card scnCard" data-scn="'+s.id+'">'
      +'<div class="billName">'+s.tag+' '+s.title+'</div>'
      +'<div class="meta">'+esc(s.venue)+'</div>'
      +'<div class="mandateLine">'+esc(s.blurb)+'</div>'
      +(best?'<div class="best">YOUR RECORD: '+esc(best)+'</div>':'')
      +'</button>';
  }
  h+='<div class="rule"></div><div class="meta" style="text-align:center">All nations fictional. All incentives real.<br>7 votes. 1 crisis. Your score is the damage.</div>';
  app.innerHTML=h;
  app.querySelectorAll('[data-scn]').forEach(b=>b.onclick=()=>{ audio(); sndClick();
    startRun(SCENARIOS.find(x=>x.id===b.dataset.scn)); });
  const bd=document.getElementById('bDaily');
  if(bd) bd.onclick=()=>{ audio(); sndClick();
    startRun(dscn,{date:dstr,n:dno,seed:CORE.dailySeed(dstr)}); };
  const bc=document.getElementById('bDailyCopy');
  if(bc) bc.onclick=async()=>{
    try{ await navigator.clipboard.writeText(drec.share); bc.textContent='COPIED ✓'; }catch(e){}
  };
  if(drec){
    const cd=document.getElementById('dailyCd');
    const tickCd=()=>{
      if(!document.body.contains(cd)){ clearTitleTimer(); return; }
      cd.textContent='next mandate in '+CORE.fmtCountdown(CORE.msToNextUtcDay(Date.now()));
    };
    tickCd(); titleTimer=setInterval(tickCd,1000);
  }
  window.scrollTo(0,0);
}

// ---------- run setup ----------
// daily = {date,n,seed} for the Daily; omitted for free play, which stays random.
function startRun(scn,daily){
  clearTitleTimer();
  const seed=daily?daily.seed:((Date.now()^(Math.random()*1e9))>>>0);
  S={scn, seed, daily:daily||null, rng:CORE.mulberry32(seed), round:1, kpi:scn.kpi0,
     streak:0, maxStreak:0, whipCorrect:0, whipTotal:0,
     pool:CORE.shuffle(CORE.mulberry32(seed^0xBEEF), scn.policies),
     earned:[], crisisDone:false, headlineIdx:{pass:0,fail:0,big:0}};
  showKpi(scn);
  setTicker(scn);
  screenBrief();
}
function screenBrief(){
  const scn=S.scn;
  let h='<h3>Your appointment</h3>'
    +'<h2>'+esc(scn.role)+'</h2>'
    +'<div class="meta">'+esc(scn.venue)+'</div>'
    +'<div class="card"><em>'+esc(scn.mandate)+'</em></div>'
    +'<h3>Know the room</h3><div class="roster">';
  for(const f of scn.factions){
    h+='<div class="card"><div class="factionHead">'
      +'<div class="fIcon" style="background:'+f.color+'">'+f.icon+'</div>'
      +'<div><div class="fName">'+esc(f.name)+'</div>'
      +'<div class="fBio">'+esc(f.bio)+'</div></div></div></div>';
  }
  h+='</div><div class="meta" style="margin-top:10px">Every bill needs <b>2 YEAs</b> from 3 factions. Read the room. Pitch what they love — never what they hate.</div>'
    +'<button class="btn" id="go">TAKE THE OATH (loosely)</button>';
  app.innerHTML=h;
  document.getElementById('go').onclick=()=>{ sndClick(); screenFloor(); };
  window.scrollTo(0,0);
}

// ---------- floor (pick a bill) ----------
function screenFloor(){
  const scn=S.scn;
  const offers=S.pool.slice(0,3);
  let h='<div class="dots">SESSION '+S.round+' OF 7'+(S.streak>=2?' · MOMENTUM ×'+CORE.streakMult(S.streak).toFixed(2):'')+'</div>'
    +'<h3>On the floor today</h3>';
  offers.forEach((p,i)=>{
    h+='<button class="card" data-i="'+i+'">'
      +'<div class="billName">'+esc(p.name)+'</div>'
      +'<div class="billDesc">'+esc(p.desc)+'</div>'
      +'<div class="billNums"><span class="gain">projected +'+fmtGainNum(scn,p.base)+'</span>'
      +' &nbsp;·&nbsp; <span class="risk">if it fails: −'+fmtGainNum(scn,p.rider)+'</span></div>'
      +'</button>';
  });
  app.innerHTML=h;
  app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    sndClick();
    const p=offers[+b.dataset.i];
    // chosen leaves the pool; unchosen offers rotate to the back
    S.pool=S.pool.slice(3).concat(offers.filter(x=>x!==p));
    startWhip(p);
  });
  window.scrollTo(0,0);
}

// ---------- whip ----------
function startWhip(policy){
  S.bill=policy;
  S.whipFactions=CORE.pickN(S.rng, S.scn.factions, 3);
  S.whipOpts=S.whipFactions.map(f=>CORE.whipOptions(S.rng,S.scn.levers,f.fav,f.hate,S.scn.lines));
  S.picks=[]; screenWhip();
}
function screenWhip(){
  const i=S.picks.length, f=S.whipFactions[i], opts=S.whipOpts[i];
  let h='<div class="dots">THE WHIP — '+(i+1)+' OF 3 · <i>'+esc(S.bill.name)+'</i></div>'
    +'<div class="card"><div class="factionHead">'
    +'<div class="fIcon" style="background:'+f.color+'">'+f.icon+'</div>'
    +'<div><div class="fName">'+esc(f.name)+'</div>'
    +'<div class="fBio">'+esc(f.bio)+'</div></div></div></div>'
    +'<div class="pitchLead">YOU LEAN IN AND SAY —</div>';
  opts.forEach((o,j)=>{ h+='<button class="card" data-j="'+j+'">'+esc(o.text)+'</button>'; });
  app.innerHTML=h;
  app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{
    sndClick();
    S.picks.push(opts[+b.dataset.j].lever);
    if(S.picks.length<3) screenWhip(); else screenTally();
  });
  window.scrollTo(0,0);
}

// ---------- tally ----------
function nextHeadline(tier){
  const pool=S.scn.headlines[tier];
  const t=pool[S.headlineIdx[tier]%pool.length];
  S.headlineIdx[tier]++;
  return t.replace('{KPI}', S.scn.fmt(S.kpi));
}
function screenTally(){
  const scn=S.scn;
  const res=CORE.resolveWhip(S.picks, S.whipFactions);
  const passed=CORE.votePasses(res.yea,res.nay);
  const delta=CORE.kpiDelta(S.bill.base,res.correct,S.streak,passed,S.bill.rider,scn.integer);
  const oldKpi=S.kpi;
  S.kpi=Math.max(0, S.kpi+delta);
  S.whipCorrect+=res.correct; S.whipTotal+=3;
  if(passed){ S.streak++; S.maxStreak=Math.max(S.maxStreak,S.streak); } else S.streak=0;
  const tier=passed?(res.correct===3?'big':'pass'):'fail';
  const head=nextHeadline(tier);
  S.earned.push({tier,text:head});
  const quip={YEA:'“aye.”',NAY:'“absolutely not.”',ABSTAIN:'(noncommittal shrug)'};
  let h='<div class="dots">THE TALLY · '+esc(S.bill.name)+'</div>';
  S.whipFactions.forEach((f,i)=>{
    h+='<div class="tallyRow"><span><b>'+esc(f.name)+'</b> <span class="quip">'+quip[res.votes[i]]+'</span></span>'
      +'<span class="vote v'+res.votes[i].slice(0,3)+'">'+res.votes[i]+'</span></div>';
  });
  h+='<div class="banner '+(passed?'bPass':'bFail')+'">'+(passed?(res.correct===3?'PASSED — UNANIMOUS':'PASSED'):'FAILED')+'</div>'
    +'<div style="text-align:center" class="meta">'+(passed
      ?('the '+esc(scn.kpiLabel.toLowerCase())+' rises by <b>'+fmtGainNum(scn,delta)+'</b>'+(res.correct===3?' <b>(unanimity bonus)</b>':''))
      :('the opposition’s rider cuts <b>'+fmtGainNum(scn,-delta)+'</b>'))+'</div>'
    +'<div class="headline"><div class="hKick">— THE DAILY MANDATE —</div><div class="hText">'+esc(head)+'</div></div>'
    +'<button class="btn" id="next">'+(S.round===4&&!S.crisisDone?'NEXT SESSION — WAIT. SOMETHING IS HAPPENING.':'NEXT SESSION')+'</button>';
  app.innerHTML=h;
  animKpi(oldKpi,S.kpi);
  if(passed) sndPass(); else sndFail();
  setTicker(scn, S.earned.map(e=>e.text));
  document.getElementById('next').onclick=()=>{
    sndClick();
    if(S.round===4&&!S.crisisDone){ screenCrisis(); return; }
    S.round++;
    if(S.round>7) screenFinale(); else screenFloor();
  };
  window.scrollTo(0,0);
}

// ---------- crisis ----------
function screenCrisis(){
  const c=S.scn.crisis;
  S.crisisDone=true;
  let h='<div class="crisis"><div class="crisisHead">⚠ BREAKING — DECIDE NOW</div>'
    +'<div style="margin:8px 0"><b>'+esc(c.prompt)+'</b></div>'
    +'<div id="cBar"><div id="cFill"></div></div><div id="cOpts">';
  c.options.forEach((o,i)=>{ h+='<button class="card" data-i="'+i+'">'+esc(o.t)+'</button>'; });
  h+='</div></div>';
  app.innerHTML=h;
  let left=10.0; const fill=document.getElementById('cFill');
  const iv=setInterval(()=>{
    left-=0.1; if(left<=3&&Math.abs(left-Math.round(left))<0.05) sndTick();
    fill.style.width=Math.max(0,left/10*100)+'%';
    if(left<=0){ clearInterval(iv); resolveCrisis(0); }
  },100);
  function resolveCrisis(i){
    clearInterval(iv);
    const o=c.options[i], oldKpi=S.kpi;
    S.kpi=Math.max(0,S.kpi+o.delta);
    S.earned.push({tier:'crisis',text:o.headline});
    let hh='<div class="banner '+(o.delta>=0?'bPass':'bFail')+'">'+(o.delta>=0?'CRISIS HANDLED':'CRISIS MISHANDLED')+'</div>'
      +'<div style="text-align:center" class="meta">the '+esc(S.scn.kpiLabel.toLowerCase())+' '
      +(o.delta>=0?'rises':'falls')+' by <b>'+fmtGainNum(S.scn,Math.abs(o.delta))+'</b></div>'
      +'<div class="headline"><div class="hKick">— THE DAILY MANDATE —</div><div class="hText">'+esc(o.headline)+'</div></div>'
      +'<button class="btn" id="next">BACK TO BUSINESS</button>';
    app.innerHTML=hh;
    animKpi(oldKpi,S.kpi);
    if(o.delta>=0) sndPass(); else sndFail();
    setTicker(S.scn, S.earned.map(e=>e.text));
    document.getElementById('next').onclick=()=>{ sndClick(); S.round++;
      if(S.round>7) screenFinale(); else screenFloor(); };
  }
  app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ sndClick(); resolveCrisis(+b.dataset.i); });
  window.scrollTo(0,0);
}

// ---------- finale ----------
function topHeadlines(){
  const order={crisis:0,big:1,pass:2,fail:3};
  return S.earned.slice().sort((a,b)=>order[a.tier]-order[b.tier]).map(e=>e.text)
    .filter((t,i,a)=>a.indexOf(t)===i).slice(0,3);
}
function screenFinale(){
  const scn=S.scn;
  const gain=S.kpi-scn.kpi0;
  const gradeVal=scn.gradeOn==='final'?S.kpi:gain;
  const grade=CORE.gradeFor(scn.grades, gradeVal);
  const kpiStr=scn.fmt(S.kpi);
  const heads=topHeadlines();
  const prevRaw=localStorage.getItem(bestKey(scn.id)+'_v');
  const isRecord=prevRaw===null||gradeVal>parseFloat(prevRaw);
  if(isRecord){ try{ localStorage.setItem(bestKey(scn.id)+'_v',String(gradeVal));
    localStorage.setItem(bestKey(scn.id), kpiStr+' — '+grade); }catch(e){} }
  const dailyNo=S.daily?S.daily.n:null;
  const card=composeFrontPage(scn,kpiStr,grade,heads,dailyNo);
  S.shareTxt=CORE.emojiShare(scn.tag,scn.title,kpiStr,grade,heads[0]||'',S.maxStreak,S.whipCorrect,S.whipTotal,dailyNo);
  if(S.daily) saveDaily(S.daily.date,{n:dailyNo,pack:scn.id,title:scn.title,
                                      kpi:kpiStr,grade:grade,share:S.shareTxt});
  let h=(dailyNo!=null?'<div class="dots">THE DAILY MANDATE №'+dailyNo+' — FILED</div>':'')
    +'<div style="text-align:center;margin:8px 0"><span class="stamp">'+esc(grade)+'</span></div>'
    +(isRecord?'<div style="text-align:center" class="best">A PERSONAL RECORD. HISTORY WILL SQUINT.</div>':'')
    +'<img id="shareImg" alt="Your front page">'
    +'<div class="emojiBlock">'+esc(S.shareTxt)+'</div>'
    +'<button class="btn" id="bShare">SHARE THE FRONT PAGE</button>'
    +'<button class="btn btnGhost" id="bCopy">COPY RESULT</button>'
    +'<button class="btn btnGhost" id="bSave">SAVE FRONT PAGE</button>'
    +'<button class="btn btnGhost" id="bMenu">NEW MANDATE</button>';
  app.innerHTML=h;
  document.getElementById('shareImg').src=card.toDataURL('image/png');
  document.getElementById('bShare').onclick=async()=>{
    try{
      const blob=await new Promise(r=>card.toBlob(r,'image/png'));
      const file=new File([blob],'the-daily-mandate.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})) await navigator.share({files:[file],text:S.shareTxt});
      else if(navigator.share) await navigator.share({text:S.shareTxt});
      else await navigator.clipboard.writeText(S.shareTxt);
    }catch(e){}
  };
  document.getElementById('bCopy').onclick=async()=>{
    try{ await navigator.clipboard.writeText(S.shareTxt);
      document.getElementById('bCopy').textContent='COPIED ✓'; }catch(e){}
  };
  document.getElementById('bSave').onclick=()=>{
    const a=document.createElement('a'); a.download='the-daily-mandate.png';
    a.href=card.toDataURL('image/png'); a.click();
  };
  document.getElementById('bMenu').onclick=()=>{ sndClick(); screenTitle(); };
  window.scrollTo(0,0);
}
function composeFrontPage(scn,kpiStr,grade,heads,dailyNo){
  const c=document.createElement('canvas'); c.width=900; c.height=1200;
  const g=c.getContext('2d');
  g.fillStyle='#f6f1e3'; g.fillRect(0,0,900,1200);
  g.strokeStyle='#1c1a16'; g.lineWidth=3; g.strokeRect(28,28,844,1144);
  g.fillStyle='#1c1a16'; g.textAlign='center';
  g.font='bold 64px Georgia'; g.fillText('THE DAILY MANDATE',450,120);
  g.font='italic 20px Georgia'; g.fillStyle='#6b6355';
  g.fillText('All nations fictional. All incentives real.',450,152);
  const date=new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
  let meta=date+'  ·  '+scn.venue;
  if(dailyNo!=null) meta='DAILY MANDATE №'+dailyNo+'  ·  '+meta;
  let mf=16; g.font=mf+'px Arial';               // long venues must not run off the page
  while(g.measureText(meta).width>770&&mf>10){ mf--; g.font=mf+'px Arial'; }
  g.fillText(meta,450,182);
  g.strokeStyle='#1c1a16'; g.lineWidth=2;
  g.beginPath(); g.moveTo(60,200); g.lineTo(840,200); g.stroke();
  g.beginPath(); g.moveTo(60,206); g.lineTo(840,206); g.stroke();
  // KPI
  g.font='bold 15px Arial'; g.fillStyle='#6b6355';
  g.fillText(scn.kpiLabel,450,252);
  g.font='bold 92px Georgia'; g.fillStyle='#1c1a16';
  g.fillText(kpiStr,450,344);
  g.strokeStyle='#c9c0ab'; g.lineWidth=1.5;
  g.beginPath(); g.moveTo(150,384); g.lineTo(750,384); g.stroke();
  const wrap=(txt,maxW,font)=>{ g.font=font; const words=txt.split(' '),out=[]; let cur='';
    for(const w of words){ const t=cur?cur+' '+w:w;
      if(g.measureText(t).width>maxW&&cur){out.push(cur);cur=w;}else cur=t; }
    if(cur)out.push(cur); return out; };
  let y=448;
  if(heads[0]){
    g.fillStyle='#1c1a16';
    const l=wrap(heads[0],760,'bold 42px Georgia');
    g.font='bold 42px Georgia';
    l.forEach(t=>{ g.fillText(t,450,y); y+=50; });
    y+=6;
  }
  g.strokeStyle='#c9c0ab'; g.beginPath(); g.moveTo(150,y); g.lineTo(750,y); g.stroke(); y+=46;
  for(let i=1;i<heads.length;i++){
    g.fillStyle='#3a352c'; g.font='italic 27px Georgia';
    const l=wrap(heads[i],720,'italic 27px Georgia');
    l.forEach(t=>{ g.fillText(t,450,y); y+=35; });
    y+=20;
  }
  // grade stamp
  g.save(); g.translate(450,1020); g.rotate(-0.05);
  let f=40; g.font='bold '+f+'px Arial';
  while(g.measureText(grade).width>720&&f>24){ f-=2; g.font='bold '+f+'px Arial'; }
  const vw=g.measureText(grade).width+70;
  g.strokeStyle='#a02020'; g.lineWidth=6; g.strokeRect(-vw/2,-f-6,vw,f+34);
  g.fillStyle='#a02020'; g.fillText(grade,0,8); g.restore();
  g.font='16px Arial'; g.fillStyle='#6b6355';
  g.fillText(scn.title+'  ·  mandate.defimagic.io',450,1140);
  return c;
}

// keyboard 1/2/3 picks the visible cards
addEventListener('keydown',e=>{
  const n={Digit1:0,Digit2:1,Digit3:2}[e.code];
  if(n===undefined) return;
  const btns=app.querySelectorAll('button.card');
  if(btns[n]) btns[n].click();
});

screenTitle();
</script>
